[tool.poetry]
name = "playwright-ui-adapter"
version = "1.0.0"
description = "LLM-powered UI test automation with two-agent architecture"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"
packages = [{include = "playwright_ui_adapter"}]

[tool.poetry.dependencies]
python = "^3.9"
playwright = "^1.41.0"
openpyxl = "^3.1.2"
pandas = "^2.0.0"
google-cloud-aiplatform = "^1.40.0"
google-auth = "^2.27.0"
httpx = "^0.26.0"
pydantic = "^2.5.0"
pydantic-settings = "^2.1.0"
python-dotenv = "^1.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.21.0"
pytest-playwright = "^0.4.0"
pytest-cov = "^4.1.0"
mypy = "^1.8.0"
black = "^23.12.0"
ruff = "^0.1.0"
types-requests = "^2.31.0"

[tool.poetry.scripts]
ui-adapter = "scripts.main:main"
ui-adapter-validate = "scripts.validation_main:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 120
target-version = ['py39', 'py310', 'py311']
exclude = '''
/(
    \.git
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 120
target-version = "py39"
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --cov=playwright_ui_adapter --cov-report=html --cov-report=term"
